<div class="page-shell">

  <header class="page-header">
    <div>
      <h1>{{ 'mem.title' | t }}</h1>
      <p class="subtitle">
        {{ 'mem.subtitle.a' | t }}
        <strong>{{ profileService.current()?.name || 'default' }}</strong> {{ 'mem.subtitle.b' | t }}
      </p>
    </div>
    <div class="head-actions">
      <button class="btn-ghost" (click)="load()" [disabled]="loading()">{{ 'common.refresh' | t }}</button>
      <button class="btn-danger" *ngIf="memories().length" (click)="forgetAll()">{{ 'mem.forgetAll' | t }}</button>
    </div>
  </header>

  <!-- Settings + add -->
  <section class="card">
    <label class="switch-row">
      <input type="checkbox" [checked]="memoryProfileEnabled()" (change)="toggleProfileMemory()" />
      <span>{{ 'mem.autoExtract' | t }}</span>
    </label>

    <div class="add-row">
      <select class="text-input cat-select" [(ngModel)]="formCategory">
        <option *ngFor="let c of categories" [value]="c">{{ categoryIcons[c] }} {{ c }}</option>
      </select>
      <input
        type="text"
        class="text-input"
        [placeholder]="'mem.addPlaceholder' | t"
        [(ngModel)]="formContent"
        (keyup.enter)="add()" />
      <button class="btn" (click)="add()" [disabled]="!formContent.trim()">{{ 'common.add' | t }}</button>
    </div>
  </section>

  <!-- Memory list -->
  <ul class="item-list" *ngIf="memories().length; else empty">
    <li *ngFor="let mem of memories()" class="item" [class.disabled-item]="!mem.enabled">
      <div class="item-main mem-main">
        <span class="mem-category" [title]="mem.category">{{ categoryIcons[mem.category] || '💡' }}</span>
        <span class="mem-content" [title]="mem.content">{{ mem.content }}</span>
      </div>
      <div class="item-actions">
        <button class="btn-ghost sm" (click)="toggleItem(mem)" [title]="(mem.enabled ? 'common.disable' : 'common.enable') | t">
          {{ (mem.enabled ? 'mem.active' : 'mem.inactive') | t }}
        </button>
        <button class="btn-danger sm" (click)="delete(mem.id, $event)" [title]="'mem.forget' | t">{{ 'common.delete' | t }}</button>
      </div>
    </li>
  </ul>
  <ng-template #empty>
    <p class="empty" *ngIf="!loading()">{{ 'mem.empty' | t }}</p>
  </ng-template>

</div>
