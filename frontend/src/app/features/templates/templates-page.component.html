<div class="page-shell">

  <header class="page-header">
    <div>
      <h1>{{ 'tpl.title' | t }}</h1>
      <p class="subtitle">
        {{ 'tpl.subtitle.a' | t }} <strong>{{ profileService.current()?.name || 'default' }}</strong>.
        {{ 'tpl.subtitle.b' | t }}
      </p>
    </div>
    <div class="head-actions">
      <button class="btn-ghost" (click)="load()" [disabled]="loading()">{{ 'common.refresh' | t }}</button>
      <button class="btn" (click)="formVisible ? cancelForm() : showForm()">
        {{ (formVisible ? 'common.close' : 'tpl.new') | t }}
      </button>
    </div>
  </header>

  <!-- Create / edit form -->
  <section class="card" *ngIf="formVisible">
    <div class="card-head"><h2>{{ (editId ? 'tpl.edit' : 'tpl.new') | t }}</h2></div>
    <div class="field">
      <span class="field-label">{{ 'common.name' | t }}</span>
      <input class="text-input" type="text" [placeholder]="'tpl.namePlaceholder' | t" [(ngModel)]="formName" />
    </div>
    <div class="field">
      <span class="field-label">{{ 'tpl.content' | t }}</span>
      <textarea class="text-area" rows="6" [placeholder]="'tpl.contentPlaceholder' | t" [(ngModel)]="formContent"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" (click)="save()" [disabled]="!formName.trim() || !formContent.trim()">
        {{ (editId ? 'common.update' : 'common.save') | t }}
      </button>
      <button class="btn-ghost" (click)="cancelForm()">{{ 'common.cancel' | t }}</button>
    </div>
  </section>

  <!-- List -->
  <ul class="item-list" *ngIf="templates().length; else empty">
    <li *ngFor="let t of templates()" class="item">
      <div class="item-main">
        <strong class="item-name">{{ t.name }}</strong>
        <p class="item-preview">{{ t.content }}</p>
      </div>
      <div class="item-actions">
        <button class="btn-ghost sm" (click)="apply(t)" [title]="'tpl.applyTitle' | t">{{ 'common.apply' | t }}</button>
        <button class="btn-ghost sm" (click)="showForm(t)" [title]="'common.edit' | t">{{ 'common.edit' | t }}</button>
        <button class="btn-danger sm" (click)="delete(t.id, $event)" [title]="'common.delete' | t">{{ 'common.delete' | t }}</button>
      </div>
    </li>
  </ul>
  <ng-template #empty>
    <p class="empty" *ngIf="!loading()">{{ 'tpl.empty' | t }}</p>
  </ng-template>

</div>
