<div class="page-shell">

  <header class="page-header">
    <div>
      <h1>{{ 'tags.title' | t }}</h1>
      <p class="subtitle">
        {{ 'tags.subtitle.a' | t }}
        <strong>{{ profileService.current()?.name || 'default' }}</strong>.
      </p>
    </div>
    <div class="head-actions">
      <button class="btn-ghost" (click)="load()" [disabled]="loading()">{{ 'common.refresh' | t }}</button>
      <button class="btn" (click)="formVisible ? cancelForm() : showForm()">
        {{ (formVisible ? 'common.close' : 'tags.new') | t }}
      </button>
    </div>
  </header>

  <!-- Create / edit form -->
  <section class="card" *ngIf="formVisible">
    <div class="card-head"><h2>{{ (editId ? 'tags.edit' : 'tags.new') | t }}</h2></div>
    <div class="field">
      <span class="field-label">{{ 'common.name' | t }}</span>
      <input class="text-input" type="text" [placeholder]="'tags.namePlaceholder' | t" [(ngModel)]="formName" />
    </div>
    <div class="field">
      <span class="field-label">{{ 'tags.color' | t }}</span>
      <div class="color-picker">
        <button
          *ngFor="let c of TAG_COLORS"
          class="color-swatch"
          [style.background]="c"
          [class.selected]="formColor === c"
          (click)="formColor = c"
          type="button"
        ></button>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" (click)="save()" [disabled]="!formName.trim()">
        {{ (editId ? 'common.update' : 'common.save') | t }}
      </button>
      <button class="btn-ghost" (click)="cancelForm()">{{ 'common.cancel' | t }}</button>
    </div>
  </section>

  <!-- List -->
  <ul class="item-list" *ngIf="tags().length; else empty">
    <li *ngFor="let tag of tags()" class="item">
      <div class="item-main tag-main">
        <span class="tag-dot" [style.background]="tag.color"></span>
        <strong class="item-name">{{ tag.name }}</strong>
      </div>
      <div class="item-actions">
        <button class="btn-ghost sm" (click)="showForm(tag)" [title]="'common.edit' | t">{{ 'common.edit' | t }}</button>
        <button class="btn-danger sm" (click)="delete(tag.id, $event)" [title]="'common.delete' | t">{{ 'common.delete' | t }}</button>
      </div>
    </li>
  </ul>
  <ng-template #empty>
    <p class="empty" *ngIf="!loading()">{{ 'chat.tags.none' | t }}</p>
  </ng-template>

</div>
