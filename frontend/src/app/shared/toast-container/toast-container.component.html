<div class="toast-stack" aria-live="assertive" aria-atomic="false">
  <div
    *ngFor="let t of notifications.toasts(); trackBy: trackById"
    class="toast"
    [class.toast-error]="t.type === 'error'"
    [class.toast-warning]="t.type === 'warning'"
    [class.toast-info]="t.type === 'info'"
    [class.toast-success]="t.type === 'success'"
    [class.toast-clickable]="!!t.onClick"
    (click)="t.onClick && click(t)"
  >
    <span class="toast-icon">{{ icon(t.type) }}</span>
    <div class="toast-body">
      <span class="toast-title">{{ t.title }}</span>
      <span class="toast-detail" *ngIf="t.detail">{{ t.detail }}</span>
      <div class="toast-actions" *ngIf="t.actions?.length">
        <button
          *ngFor="let a of t.actions"
          class="toast-action"
          (click)="runAction(t, a); $event.stopPropagation()"
        >{{ a.label }}</button>
      </div>
    </div>
    <button class="toast-close" (click)="dismiss(t.id); $event.stopPropagation()" [attr.aria-label]="'common.close' | t">✕</button>
  </div>
</div>
